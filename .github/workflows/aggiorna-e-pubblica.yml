name: Aggiorna dati e pubblica

on:
  schedule:
    # Ogni 2 ore (orari UTC). GitHub può partire con qualche minuto di ritardo nei momenti di carico.
    - cron: '17 */2 * * *'
  # Un push pubblica le modifiche al codice, senza scraping.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-e-pubblica
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test dei parser
        run: npm test

      # Cache HTTP (ETag) e stato della scoperta dei gironi: evita richieste inutili alle fonti.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: scraper-${{ github.run_id }}
          restore-keys: scraper-

      - name: Scraping
        id: scraper
        if: github.event_name != 'push'
        env:
          SCRAPER_USER_AGENT: 'CalendarioGareParma/0.1 (+https://github.com/${{ github.repository }}; progetto non commerciale)'
          SCRAPER_CACHE_MINUTI: '0'
        run: |
          set +e
          # myvolley.net (Cloudflare) risponde 403 agli IP di GitHub: si aggiorna dal PC con scripts/aggiorna-nazionali.ps1.
          npm run scrape -- --salta=myvolley
          echo "esito=$?" >> "$GITHUB_OUTPUT"

      - name: Report squadre di Parma
        if: github.event_name != 'push'
        run: cat data/report-parma.md >> "$GITHUB_STEP_SUMMARY"

      # Commit solo se è cambiato qualcosa oltre all'orario di generazione in meta.json.
      - name: Salva i dati nel repository
        if: github.event_name != 'push'
        run: |
          git add data
          if git diff --cached --quiet -- . ':(exclude)data/meta.json'; then
            echo "Nessuna variazione nei dati."
            git reset -q
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -q -m "Aggiorna dati gare"
            git push || echo "::warning::Push rifiutato: nel frattempo è arrivato un altro aggiornamento. I dati verranno rigenerati alla prossima esecuzione."
          fi

      # Pubblicazione su Aruba senza FTP (scripts/pubblica-aruba.ts): build e invio al server dei soli file cambiati.
      # Se non è cambiato nulla non si invia niente. Senza il secret ARUBA_CHIAVE viene saltata.
      - name: Pubblicazione su Aruba
        env:
          ARUBA_CHIAVE: ${{ secrets.ARUBA_CHIAVE }}
        run: npm run pubblica:aruba

      # Se una fonte è fallita i dati precedenti restano pubblicati, ma l'esecuzione viene segnata come fallita.
      - name: Segnala fonti non aggiornate
        if: steps.scraper.outputs.esito != '' && steps.scraper.outputs.esito != '0'
        run: |
          echo "::error::Almeno una fonte non è stata aggiornata: vedi il log del passo 'Scraping'. Sono rimasti pubblicati gli ultimi dati validi."
          exit 1
